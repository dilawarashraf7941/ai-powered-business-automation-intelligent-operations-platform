name: main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Test with coverage
        run: python -m pytest --cov

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Type check
        run: python -m mypy

      - name: Audit dependencies
        run: python -m pip_audit .

      - name: Run focused security scan
        run: python scripts/security_scan.py

      - name: Verify production release constraints
        run: python scripts/verify_release.py
